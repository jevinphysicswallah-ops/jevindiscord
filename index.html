<body class="nature-bg-main text-[#d1d5db]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // API Client with automatic Auth Header & host resolution (works on Wi-Fi IP and localhost)
    const API = {
      getToken() {
        return localStorage.getItem('nexus_session_token');
      },
      setToken(token) {
        if (token) localStorage.setItem('nexus_session_token', token);
        else localStorage.removeItem('nexus_session_token');
      },
      async request(endpoint, options = {}) {
        const token = this.getToken();
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(endpoint, { ...options, headers });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || 'Request failed');
        }
        return data;
      }
    };

    // Lucide Icon Helper
    function LucideIcon({ name, className = "w-5 h-5", ...props }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (!containerRef.current || !window.lucide) return;
        const kebab = name
          .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
          .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
          .toLowerCase();
        containerRef.current.innerHTML = `<i data-lucide="${kebab}" class="${className}"></i>`;
        window.lucide.createIcons({ root: containerRef.current });
      }, [name, className]);
      return <span ref={containerRef} className="inline-flex items-center justify-center pointer-events-none" {...props} />;
    }

    // Enhanced Audio SFX & Procedural Lounge Music Engine
    const SFX = {
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      initUserGestureUnlock() {
        const unlock = () => {
          const ctx = this.getCtx();
          if (ctx && ctx.state === 'suspended') {
            ctx.resume();
          }
        };
        ['click', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, unlock, { once: true }));
      },
      playPop() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      },
      playWin() {
        const ctx = this.getCtx();
        if (!ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = ctx.currentTime + i * 0.08;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.08, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.2);
        });
      },
      // Friend Connected Fanfare Chime (5-Note Pentatonic Chime)
      playFriendConnect() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 987.77, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + idx * 0.08;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.09, start);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.65);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.65);
        });
      },
      // Friend Added Level-Up Music Fanfare + Warm Major Pad
      playFriendAddMusic() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const arpeggio = [349.23, 440.0, 523.25, 659.25, 783.99, 1046.50];
        arpeggio.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + idx * 0.09;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.12, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.45);
        });
        [261.63, 392.00, 659.25].forEach((freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + 0.54;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.08, start);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 1.2);
        });
      },
      // Friend Request Ping
      playFriendRequest() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        [880.0, 1174.66].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const start = now + idx * 0.12;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.1, start);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.35);
        });
      }
    };

    // Natural Organic Musical Sound Engine (Mic, Video, and Enter buttons)
    const NatureAudio = {
      ctx: null,
      getCtx() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      // Natural resonant bamboo chime (Touched Mic button)
      playMic() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        [293.66, 587.33, 1174.66].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = idx === 0 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(idx === 1 ? 0.15 : 0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.28);
        });
      },
      // Natural spring water drop ripple (Touched Video/Camera button)
      playVideo() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(1350, now + 0.12);
        gain.gain.setValueAtTime(0.13, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.32);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1760, now + 0.06);
        gain2.gain.setValueAtTime(0.06, now + 0.06);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.06);
        osc2.stop(now + 0.26);
      },
      // Natural sunrise harp / kalimba arpeggio (Touched Enter / Join / Submit buttons)
      playEnter() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 987.77, 1046.50];
        notes.forEach((freq, idx) => {
          const start = now + idx * 0.045;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.09, start);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.55);
        });
      },
      // Natural crystal wind chime chord (Touched Logo / App Launcher)
      playLogo() {
        const ctx = this.getCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [440.0, 554.37, 659.25, 880.0, 1108.73, 1318.51];
        notes.forEach((freq, idx) => {
          const start = now + idx * 0.035;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.08, start);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.85);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.85);
        });
      }
    };

    // Procedural Chill Gaming Lounge Beats Synthesizer (Zero Assets / No MP3 required)
    const LoungeMusic = {
      ctx: null,
      isPlaying: false,
      timer: null,
      step: 0,
      gainNode: null,
      customChords: null,
      volume: 0.07,
      getCtx() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      },
      setVolume(vol) {
        this.volume = Math.max(0, Math.min(1.0, vol)) * 0.12;
        if (this.gainNode && this.ctx) {
          this.gainNode.gain.setValueAtTime(this.volume, this.ctx.currentTime);
        }
      },
      setTrackChords(chords) {
        if (Array.isArray(chords) && chords.length > 0) {
          this.customChords = chords;
        }
      },
      toggle(onStateChange) {
        if (this.isPlaying) {
          this.stop();
        } else {
          this.start();
        }
        if (onStateChange) onStateChange(this.isPlaying);
      },
      start() {
        const ctx = this.getCtx();
        if (!ctx) return;
        this.isPlaying = true;
        this.step = 0;
        if (!this.gainNode) {
          this.gainNode = ctx.createGain();
          this.gainNode.gain.setValueAtTime(this.volume, ctx.currentTime);
          this.gainNode.connect(ctx.destination);
        }
        this.scheduleNext();
      },
      stop() {
        this.isPlaying = false;
        if (this.timer) {
          clearTimeout(this.timer);
          this.timer = null;
        }
      },
      scheduleNext() {
        if (!this.isPlaying) return;
        const ctx = this.getCtx();
        if (!ctx) return;

        const defaultChords = [
          [220.0, 261.63, 329.63, 493.88], // Am9
          [174.61, 261.63, 329.63, 392.00], // Fmaj7
          [130.81, 261.63, 329.63, 392.00], // Cmaj7
          [196.00, 246.94, 293.66, 440.00]  // Gadd9
        ];
        const activeChords = this.customChords || defaultChords;
        const chord = activeChords[this.step % activeChords.length];
        this.step++;

        const now = ctx.currentTime;
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(850, now);
        filter.connect(this.gainNode);

        chord.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = idx === 0 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.05, now + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.55);
          osc.connect(gain);
          gain.connect(filter);
          osc.start(now);
          osc.stop(now + 1.6);
        });

        this.timer = setTimeout(() => this.scheduleNext(), 1400);
      }
    };

    function RemoteVideoTile({ stream, friend }) {
      const videoRef = useRef(null);
      const [isPlayBlocked, setIsPlayBlocked] = useState(false);

      const attemptPlay = () => {
        if (videoRef.current) {
          videoRef.current.play().then(() => {
            setIsPlayBlocked(false);
          }).catch((err) => {
            console.log('Video autoplay blocked, waiting for user touch/gesture:', err);
            setIsPlayBlocked(true);
          });
        }
      };

      useEffect(() => {
        if (videoRef.current && stream) {
          videoRef.current.srcObject = stream;
          attemptPlay();
        }
      }, [stream]);

      return (
        <div className="relative w-full h-full" onClick={attemptPlay}>
          <video
            ref={videoRef}
            autoPlay
            playsInline
            muted
            className="w-full h-full object-cover"
          />
          {isPlayBlocked && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-20">
              <button
                type="button"
                onClick={(e) => { e.stopPropagation(); attemptPlay(); }}
                className="px-3 py-1.5 bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold rounded-lg shadow-lg flex items-center gap-1.5 animate-pulse cursor-pointer"
              >
                <LucideIcon name="Play" className="w-3.5 h-3.5" />
                <span>Tap to Enable Video</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // =============================================================
    // DEDICATED WEBRTC LOCAL VIDEO TILE COMPONENT
    // =============================================================
    function LocalVideoTile({ stream, className = "w-full h-full object-cover transform -scale-x-100" }) {
      const videoRef = useRef(null);
      useEffect(() => {
        const videoEl = videoRef.current;
        if (!videoEl || !stream) return;
        videoEl.srcObject = stream;
        videoEl.play().catch(e => console.log('Local video play catch:', e));

        const handleTrackChange = () => {
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play().catch(() => {});
          }
        };
        stream.addEventListener('addtrack', handleTrackChange);
        stream.addEventListener('removetrack', handleTrackChange);
        return () => {
          stream.removeEventListener('addtrack', handleTrackChange);
          stream.removeEventListener('removetrack', handleTrackChange);
        };
      }, [stream]);

      return (
        <video
          ref={videoRef}
          autoPlay
          playsInline
          muted
          className={className}
        />
      );
    }

    // High-tech Virtual Studio Avatar Camera Stream Generator
    function createVirtualStudioCamera(displayName = 'Tejash Patel') {
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      let angle = 0;

      const draw = () => {
        angle += 0.05;
        // Background gradient
        const grad = ctx.createLinearGradient(0, 0, 640, 480);
        grad.addColorStop(0, '#0f172a');
        grad.addColorStop(0.5, '#1e1b4b');
        grad.addColorStop(1, '#3b0764');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 640, 480);

        // Animated Cyber Grid lines
        ctx.strokeStyle = 'rgba(139, 92, 246, 0.18)';
        ctx.lineWidth = 1;
        for (let x = 0; x < 640; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 480);
          ctx.stroke();
        }
        for (let y = 0; y < 480; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(640, y);
          ctx.stroke();
        }

        // Center Pulsing Avatar Circle
        const centerX = 320;
        const centerY = 210;
        const pulse = Math.sin(angle) * 8;

        // Outer glow ring
        ctx.beginPath();
        ctx.arc(centerX, centerY, 80 + pulse, 0, Math.PI * 2);
        ctx.strokeStyle = '#8b5cf6';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#a855f7';
        ctx.shadowBlur = 20;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Avatar body
        ctx.beginPath();
        ctx.arc(centerX, centerY, 70, 0, Math.PI * 2);
        ctx.fillStyle = '#1e1b4b';
        ctx.fill();

        // Stylized Camera Silhouette / Gamer Icon
        ctx.fillStyle = '#ec4899';
        ctx.font = 'bold 44px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🎮', centerX, centerY - 5);

        // Soundwave bars below avatar
        const bars = 16;
        const barWidth = 8;
        const spacing = 14;
        const startX = centerX - (bars * spacing) / 2;
        for (let i = 0; i < bars; i++) {
          const h = 10 + Math.abs(Math.sin(angle * 1.5 + i * 0.4)) * 35;
          ctx.fillStyle = i % 2 === 0 ? '#10b981' : '#06b6d4';
          ctx.fillRect(startX + i * spacing, 335 - h / 2, barWidth, h);
        }

        // Live HUD Overlay
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(35, 35, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#22c55e';
        ctx.textAlign = 'left';
        ctx.fillText('LIVE • STUDIO CAM 60FPS', 50, 39);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(displayName, centerX, 385);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px sans-serif';
        ctx.fillText('Virtual Video Active • WebRTC Mesh Connected', centerX, 410);
      };

      const interval = setInterval(draw, 1000 / 30);
      draw();

      const stream = canvas.captureStream(30);
      const originalStop = stream.getVideoTracks()[0].stop.bind(stream.getVideoTracks()[0]);
      stream.getVideoTracks()[0].stop = () => {
        clearInterval(interval);
        originalStop();
      };
      return stream;
    }

    // Main App Component

      const [voiceIsolationEnabled, setVoiceIsolationEnabled] = useState(true);
      const [voiceGateThreshold, setVoiceGateThreshold] = useState(2.5); // Noise gate cutoff % (Default 2.5% for ultra-sensitive vocal capture)
      const [micGainMultiplier, setMicGainMultiplier] = useState(1.2);

      // Video & Web Audio DSP refs
      const localVideoRef = useRef(null);
      const screenVideoRef = useRef(null);
      const audioAnalyserRef = useRef(null);
      const audioCtxRef = useRef(null);
      const voiceGainNodeRef = useRef(null);

      // Real-time WebRTC Mesh Peer Connections & Live Streams
      const peerConnectionsRef = useRef({});
      const iceCandidatesQueueRef = useRef({}); // Queues candidate packets if received before remote description
      const [remoteStreams, setRemoteStreams] = useState({});
      const mediaStreamRef = useRef(null);

      useEffect(() => {
        mediaStreamRef.current = mediaStream;
      }, [mediaStream]);

      // WebSocket Connection
      const wsRef = useRef(null);

      // WebRTC Peer Connection Factory for Full-Duplex Voice & Video Mesh
      const getOrCreatePeerConnection = useCallback((targetUserId) => {
        if (peerConnectionsRef.current[targetUserId]) {
          return peerConnectionsRef.current[targetUserId];
        }

        const pc = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
            { urls: 'stun:stun.cloudflare.com:3478' },
            { urls: 'stun:stun.services.mozilla.com:3478' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' },
            { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelay', credential: 'openrelay' }
          ],
          bundlePolicy: 'max-bundle'
        });

        // Add local tracks directly if stream is active
        const currentStream = mediaStreamRef.current;
        if (currentStream && currentStream.getTracks().length > 0) {
          currentStream.getTracks().forEach(track => {
            try { pc.addTrack(track, currentStream); } catch (e) {}
          });
          // If no local video track yet, add a video transceiver so we can receive remote peer video
          if (!currentStream.getVideoTracks().length) {
            try { pc.addTransceiver('video', { direction: 'recvonly' }); } catch (e) {}
          }
        } else {
          // If mediaStream is not ready yet, add transceivers so initial SDP negotiation can establish bidirectional channels
          try { pc.addTransceiver('audio', { direction: 'sendrecv' }); } catch (e) {}
          try { pc.addTransceiver('video', { direction: 'sendrecv' }); } catch (e) {}
        }

        pc.onicecandidate = (event) => {
          if (event.candidate && wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(JSON.stringify({
              event: 'webrtc_signal',
              payload: {
                targetUserId,
                signal: { candidate: event.candidate }
              }
            }));
          }
        };

        pc.onconnectionstatechange = () => {
          if (pc.connectionState === 'failed') {
            try { pc.restartIce(); } catch (e) {}
          }
        };

        // Incoming audio/video track from peer - Attach audio element and stream so people hear & see each other!
        pc.ontrack = (event) => {
          const track = event.track;

          if (track.kind === 'audio') {
            let audioEl = document.getElementById(`peer-audio-${targetUserId}`);
            if (!audioEl) {
              audioEl = document.createElement('audio');
              audioEl.id = `peer-audio-${targetUserId}`;
              audioEl.autoplay = true;
              audioEl.playsInline = true;
              audioEl.volume = 1.0;
              document.body.appendChild(audioEl);
            }
            audioEl.muted = isDeafened;
            const remoteStream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([track]);
            audioEl.srcObject = remoteStream;
            audioEl.play().catch(() => {
              const unlock = () => { audioEl.play().catch(() => {}); };
              window.addEventListener('click', unlock, { once: true });
              window.addEventListener('touchstart', unlock, { once: true });
            });
          }

          setRemoteStreams(prev => {
            const existing = prev[targetUserId];
            if (existing) {
              if (!existing.getTracks().some(t => t.id === track.id)) {
                existing.addTrack(track);
              }
              return { ...prev, [targetUserId]: new MediaStream(existing.getTracks()) };
            }
            return { ...prev, [targetUserId]: new MediaStream([track]) };
          });
        };

        peerConnectionsRef.current[targetUserId] = pc;
        return pc;
      }, []);

      // 1. Check Authenticated Session on Load (Instant auto-connect for desktop launch)
      useEffect(() => {

        const next = !isDeafened;
        setIsDeafened(next);
        if (next) {
          setIsMuted(true);
          isMutedRef.current = true;
          if (mediaStream) {
            mediaStream.getAudioTracks().forEach(t => t.enabled = false);
          }
          sendVoiceState({ isDeafened: true, isMuted: true });
        } else {
          sendVoiceState({ isDeafened: false });
        }
        NatureAudio.playMic();
      };

      // Toggle Webcam Camera (Universal Hardware Camera + Studio Avatar Fallback)
      const toggleCamera = async () => {
        NatureAudio.playVideo();
        if (isCameraOn) {
          if (mediaStreamRef.current) {
            mediaStreamRef.current.getVideoTracks().forEach(t => t.stop());
            const audioOnly = new MediaStream(mediaStreamRef.current.getAudioTracks());
            mediaStreamRef.current = audioOnly;
            setMediaStream(audioOnly);
          }
          if (localVideoRef.current) {
            localVideoRef.current.srcObject = null;
          }
          // Remove/replace video track with null on active WebRTC peer connections
          Object.values(peerConnectionsRef.current).forEach(async pc => {
            try {
              const transceivers = pc.getTransceivers ? pc.getTransceivers() : [];
              const vTransceiver = transceivers.find(t => t.receiver?.track?.kind === 'video' || (t.sender && t.sender.track && t.sender.track.kind === 'video'));
              if (vTransceiver && vTransceiver.sender) {
                await vTransceiver.sender.replaceTrack(null);
              }
            } catch (e) {}
          });
          setIsCameraOn(false);
          sendVoiceState({ isCameraOn: false });
          addHardwareLog('Camera disabled.');
        } else {
          addHardwareLog('Activating Camera...');
          let vStream = null;
          let isVirtual = false;

          // Auto-enter Voice Lounge if not yet joined so video tile is active and visible
          if (!activeVoiceChannelRef.current) {
            const vCh = currentServer?.channels?.find(c => c.type === 'voice') || { id: 'ch-lounge-1791703833357', name: 'Voice Lounge', type: 'voice' };
            await handleJoinVoiceChannel(vCh, currentServer);
          }

          // 1. Try Hardware Webcam Access with relaxed constraints
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              vStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
              });
              addHardwareLog('Physical webcam detected and authorized! 📹');
            } catch (hwErr) {
              console.warn('Physical camera prompt or hardware error:', hwErr);
              addHardwareLog(`Physical camera: ${hwErr.name || hwErr.message}. Starting Studio Cam.`);
            }
          }

          // 2. If physical camera blocked or unavailable, seamlessly use Virtual Studio Camera
          if (!vStream || vStream.getVideoTracks().length === 0) {
            vStream = createVirtualStudioCamera(currentUser?.displayName || 'Tejash Patel');
            isVirtual = true;
          }

          const vTrack = vStream.getVideoTracks()[0];
          if (vTrack) {
            vTrack.onended = () => {
              if (isCameraOn) toggleCamera();
            };
          }
          const curAudio = mediaStreamRef.current ? mediaStreamRef.current.getAudioTracks() : [];
          const combined = new MediaStream([...curAudio, vTrack]);
          mediaStreamRef.current = combined;
          setMediaStream(combined);

          // Update video track on active WebRTC peer connections & dispatch renegotiation Offer
          Object.entries(peerConnectionsRef.current).forEach(async ([targetUserId, pc]) => {
            try {
              const transceivers = pc.getTransceivers ? pc.getTransceivers() : [];
              const vTransceiver = transceivers.find(t => t.receiver?.track?.kind === 'video' || (t.sender && t.sender.track && t.sender.track.kind === 'video'));
              if (vTransceiver && vTransceiver.sender) {
                vTransceiver.direction = 'sendrecv';
                await vTransceiver.sender.replaceTrack(vTrack);
              } else {
                pc.addTrack(vTrack, combined);
              }
              if (pc.signalingState === 'stable') {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                  wsRef.current.send(JSON.stringify({
                    event: 'webrtc_signal',
                    payload: { targetUserId, signal: offer }
                  }));
                }
              }
            } catch (e) {
              console.error('WebRTC video negotiation error:', e);
            }
          });

          setIsCameraOn(true);
          sendVoiceState({ isCameraOn: true });
          addHardwareLog(isVirtual
            ? 'Studio Live Camera Activated! 📹 Full WebRTC mesh synced with Dad & Friend.'
            : 'Webcam Live! 📹 Full hardware video stream connected.');
        }
      };

      // Keep localVideoRef in sync with mediaStream
      useEffect(() => {
        if (isCameraOn && mediaStream && localVideoRef.current) {
          localVideoRef.current.srcObject = mediaStream;
        }
      }, [isCameraOn, mediaStream]);

      // Send Voice Channel Invite to Friend
      const handleSendVoiceInvite = (friend) => {
        if (!friend || !wsRef.current || wsRef.current.readyState !== WebSocket.OPEN) return;
        const vChId = activeVoiceChannel?.id || currentServer?.channels?.find(c => c.type === 'voice')?.id;
        const vChName = activeVoiceChannel?.name || currentServer?.channels?.find(c => c.type === 'voice')?.name || 'Voice Lounge';
        wsRef.current.send(JSON.stringify({
          event: 'voice_invite',
          payload: {
            targetUserId: friend.id,
            channelId: vChId,
            channelName: vChName,
            serverId: currentServer?.id || activeServerId,
            serverName: currentServer?.name || 'jadu'
          }
        }));
        setInvitedFriends(prev => ({ ...prev, [friend.id]: true }));
        SFX.playPop();
      };

      // Copy Server Invite Link
      const handleCopyServerLink = (code) => {
        const fullUrl = `${window.location.origin}/#${code || '388635F8'}`;
        navigator.clipboard.writeText(fullUrl).then(() => {
          setCopiedToast(true);
          setTimeout(() => setCopiedToast(false), 2500);
          SFX.playPop();
        }).catch(() => {
          prompt("Copy Server Invite URL:", fullUrl);
        });
      };

      // Launch an Activity while keeping Voice Connected
      const handleLaunchActivity = async (activityId) => {
        setActivityModalOpen(false);
        SFX.playPop();
        if (activityId === 'music') {
          setActiveTab('music');
        } else {
          setActiveTab('games');
          try {
            const res = await API.request('/api/games/create', {
              method: 'POST',
              body: JSON.stringify({ gameType: activityId })
            });
            setActiveGameRoom(res.room);
            loadSocialData();

        }
      };

      // Hardware Test: Screen Sharing (Video only or Isolated Audio)
      const toggleScreenShare = async () => {
        if (isScreenSharing) {
          if (screenStream) {
            screenStream.getTracks().forEach(t => t.stop());
            setScreenStream(null);
          }
          setIsScreenSharing(false);
          addHardwareLog('Screen sharing stopped.');
        } else {
          try {
            addHardwareLog('Requesting Screen Sharing (getDisplayMedia)...');
            // By default screen share video only; desktop app audio is excluded to prevent sound bleed
            const stream = await navigator.mediaDevices.getDisplayMedia({
              video: { cursor: 'always' },
              audio: false // Cut other desktop app sounds completely
            });
            setScreenStream(stream);
            setIsScreenSharing(true);
            if (screenVideoRef.current) {
              screenVideoRef.current.srcObject = stream;
            }
            stream.getVideoTracks()[0].onended = () => {
              setIsScreenSharing(false);
              addHardwareLog('Screen sharing ended by user.');
            };
            addHardwareLog('Screen Sharing active (App audio isolated from screen share). ✅');
          } catch (err) {
            addHardwareLog(`Screen share error: ${err.message}. ⚠️`);
          }
        }
      };

      const addHardwareLog = (msg) => {
        const time = new Date().toLocaleTimeString();
        setHardwareLogs(prev => [`[${time}] ${msg}`, ...prev.slice(0, 30)]);
      };

      // Send Chat Message (Natural Sunrise Kalimba Arpeggio Music on Enter)
      const handleSendMessage = (e) => {
        e.preventDefault();
        NatureAudio.playEnter();
        if (!messageInput.trim() || !activeChannelId) return;
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({
            event: 'send_message',
            payload: {
              channelId: activeChannelId,
              serverId: activeServerId,
              text: messageInput.trim()
            }
          }));
        }
        setMessageInput('');
      };

      // User Logout
      const handleLogout = async () => {
        try {
          await API.request('/api/auth/logout', { method: 'POST' });
        } finally {
          API.setToken(null);
          setCurrentUser(null);
        }

      // Active Server lookup
      const currentServer = servers.find(s => s.id === activeServerId) || servers[0];

      // Dynamic High-Definition Natural Landscape Photo Background for Every Page (Hook called unconditionally)
      const activeNatureBgClass = useMemo(() => {
        if (activeTab === 'server') {

          return isVoice ? 'nature-bg-stage' : 'nature-bg-server';
        }
        if (activeTab === 'games') return 'nature-bg-games';
        if (activeTab === 'music') return 'nature-bg-music';
        if (activeTab === 'friends') return 'nature-bg-friends';
        if (activeTab === 'hardware') return 'nature-bg-hardware';
        return 'nature-bg-lounge';
      }, [activeTab, currentServer, activeChannelId, activeVoiceChannel]);

      // If checking auth
      if (authLoading) {
        return (

      // If not logged in -> Show Premium Gaming Auth Screen

                className="w-12 h-12 rounded-[24px] bg-[#1e2026] text-[#10b981] flex items-center justify-center squircle-morph hover:rounded-[16px] hover:bg-[#10b981] hover:text-white"

                className="w-12 h-12 rounded-[24px] bg-[#1e2026] text-[#06b6d4] flex items-center justify-center squircle-morph hover:rounded-[16px] hover:bg-[#06b6d4] hover:text-white"
                title="Join Server with Invite Code"

                <LucideIcon name="Compass" className="w-5 h-5" />

            </div>

            {/* Bottom Navigation Buttons: Multiplayer Games, Music Lounge, Hardware Check, Friends */}
            <div className="w-full flex flex-col items-center gap-2 pt-2 border-t border-[#262930]">
              {/* Multiplayer Games Button */}
              <button

            <div className="flex-1 overflow-y-auto">
              {/* Server Header */}

                <div>
                  <div className="h-12 px-4 flex items-center justify-between border-b border-white/5 font-bold text-sm text-[#f9fafb]">

    // =============================================================
    // MULTIPLAYER GAMES VIEW COMPONENT
    // =============================================================
    function MultiplayerGamesView({ currentUser, gameRooms, activeGameRoom, setActiveGameRoom, wsRef, loadSocialData }) {
      const [newGameType, setNewGameType] = useState('tictactoe');
      const [joinCode, setJoinCode] = useState('');
      const [numberGuessInput, setNumberGuessInput] = useState('');

      const createGameRoom = async () => {
        NatureAudio.playEnter();
        try {
          const res = await API.request('/api/games/create', {
            method: 'POST',
            body: JSON.stringify({ gameType: newGameType })
          });
          setActiveGameRoom(res.room);
          loadSocialData();
          SFX.playWin();
        } catch (e) {
          alert(e.message);
        }
      };

      const joinGameRoom = async () => {
        if (!joinCode.trim()) return;
        NatureAudio.playEnter();
        try {
          const res = await API.request('/api/games/join', {
            method: 'POST',
            body: JSON.stringify({ code: joinCode.trim() })
          });
          setActiveGameRoom(res.room);
          loadSocialData();
          SFX.playWin();
        } catch (e) {
          alert(e.message);
        }
      };

      const sendGameAction = (action, data = {}) => {
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN && activeGameRoom) {
          wsRef.current.send(JSON.stringify({
            event: 'game_action',
            payload: { roomId: activeGameRoom.id, action, data }
          }));
        }
      };

      // If playing in a room
      if (activeGameRoom) {
        const isHost = activeGameRoom.hostId === currentUser.id;
        const myPlayer = activeGameRoom.players.find(p => p.userId === currentUser.id);

        return (
          <div className="max-w-3xl space-y-4">
            {/* Room Header */}
            <div className="bg-[#141a26]/80 backdrop-blur-xl p-4 rounded-xl border border-white/10 flex items-center justify-between">
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-white text-base">{activeGameRoom.name}</span>
                  <span className="px-2 py-0.5 rounded text-[11px] font-mono bg-[#8b5cf6]/20 text-[#8b5cf6] font-bold">
                    CODE: {activeGameRoom.code}
                  </span>
                </div>
                <div className="text-xs text-[#9ca3af] mt-0.5">Share code with a friend to join!</div>
              </div>
              <button
                onClick={() => {
                  sendGameAction('leave');
                  setActiveGameRoom(null);
                  loadSocialData();
                }}
                className="px-3 py-1.5 bg-[#262930] hover:bg-[#ef4444] text-white text-xs font-bold rounded-lg transition-colors"
              >
                Leave Room
              </button>
            </div>

            {/* Players in Lobby */}
            <div className="grid grid-cols-2 gap-3">
              {activeGameRoom.players.map(p => (
                <div key={p.userId} className="p-3 bg-[#141a26]/80 backdrop-blur-xl rounded-xl border border-white/10 flex items-center justify-between text-xs">
                  <div className="flex items-center gap-2">
                    <img src={p.avatar} className="w-8 h-8 rounded-full" />
                    <div>
                      <div className="font-bold text-white">{p.displayName}</div>
                      <div className="text-[10px] text-[#9ca3af]">@{p.username}</div>
                    </div>
                  </div>
                  <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${
                    p.isReady ? 'bg-[#10b981]/20 text-[#10b981]' : 'bg-[#f59e0b]/20 text-[#f59e0b]'
                  }`}>
                    {p.isReady ? 'READY' : 'WAITING'}
                  </span>
                </div>
              ))}
            </div>

            {/* Ready Up Button (When waiting) */}
            {activeGameRoom.status === 'waiting' && (
              <div className="p-6 bg-[#141a26]/80 backdrop-blur-xl rounded-2xl border border-white/10 text-center space-y-3">
                <div className="text-sm font-bold text-white">Lobby Status: Waiting for players to ready up</div>
                <button
                  onClick={() => sendGameAction('ready')}
                  className={`px-6 py-2.5 rounded-xl font-bold text-xs text-white transition-all shadow ${
                    myPlayer && myPlayer.isReady ? 'bg-[#ef4444]' : 'bg-[#10b981] hover:bg-[#059669]'
                  }`}
                >
                  {myPlayer && myPlayer.isReady ? 'Cancel Ready' : 'Ready Up!'}
                </button>
              </div>
            )}

            {/* LIVE GAME BOARDS */}
            {activeGameRoom.status === 'playing' && (
              <div className="p-6 bg-[#181a1f] rounded-2xl border border-[#262930]">
                {/* 1. Tic Tac Toe */}
                {activeGameRoom.gameType === 'tictactoe' && (
                  <div className="flex flex-col items-center">
                    <div className="text-sm font-bold text-white mb-4">
                      Current Turn: {activeGameRoom.players.find(p => p.userId === activeGameRoom.currentTurn)?.displayName || '...'}
                    </div>
                    <div className="grid grid-cols-3 gap-2 w-64 h-64">
                      {activeGameRoom.gameState.board.map((cell, idx) => (
                        <button
                          key={idx}
                          onClick={() => sendGameAction('move', { index: idx })}
                          className="w-full h-full bg-[#262930] hover:bg-[#2f333d] rounded-xl text-3xl font-black text-white flex items-center justify-center transition-colors"
                        >
                          {cell}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* 2. Connect Four */}
                {activeGameRoom.gameType === 'connect4' && (
                  <div className="flex flex-col items-center">
                    <div className="text-sm font-bold text-white mb-3">
                      Turn: {activeGameRoom.players.find(p => p.userId === activeGameRoom.currentTurn)?.displayName}
                    </div>
                    <div className="grid grid-cols-7 gap-1.5 p-3 bg-[#121316] rounded-xl border border-[#262930]">
                      {Array.from({ length: 7 }).map((_, c) => (
                        <button
                          key={c}
                          onClick={() => sendGameAction('move', { col: c })}
                          className="px-2 py-1 bg-[#262930] hover:bg-[#8b5cf6] text-white text-[11px] font-bold rounded mb-1"
                        >
                          ↓
                        </button>
                      ))}
                      {activeGameRoom.gameState.grid.map((row, r) =>
                        row.map((cell, c) => (
                          <div
                            key={`${r}-${c}`}
                            className={`w-9 h-9 rounded-full border border-[#262930] flex items-center justify-center ${
                              cell === 'red' ? 'bg-[#ef4444]' : cell === 'yellow' ? 'bg-[#f59e0b]' : 'bg-[#1e2026]'
                            }`}
                          />
                        ))
                      )}
                    </div>
                  </div>
                )}

                {/* 3. Rock Paper Scissors */}
                {activeGameRoom.gameType === 'rps' && activeGameRoom.gameState && (
                  <div className="flex flex-col items-center text-center space-y-4 max-w-md mx-auto">
                    <div className="text-sm font-bold text-white">Round {activeGameRoom.gameState.round} (Best of 3) ⚔️</div>
                    <div className="flex gap-3 justify-center text-xs">
                      {activeGameRoom.players.map(p => (
                        <span key={p.userId} className="font-mono px-3 py-1 bg-[#121316] rounded-lg text-white border border-[#262930]">
                          @{p.username}: <span className="text-[#8b5cf6] font-bold">{activeGameRoom.gameState.scores?.[p.userId] || 0} wins</span>
                        </span>
                      ))}
                    </div>
                    {activeGameRoom.gameState.choices?.[currentUser.id] ? (
                      <div className="p-4 bg-[#121316] rounded-xl text-xs text-[#06b6d4] font-bold border border-[#262930] w-full">
                        ✓ Choice Locked: {activeGameRoom.gameState.choices[currentUser.id].toUpperCase()}! Waiting for opponent...
                      </div>
                    ) : (
                      <div className="flex gap-3 justify-center w-full">
                        {['rock', 'paper', 'scissors'].map(choice => (
                          <button
                            key={choice}
                            onClick={() => sendGameAction('move', { choice })}
                            className="flex-1 py-3 px-2 rounded-xl bg-[#262930] hover:bg-[#8b5cf6] text-white font-bold text-xs capitalize transition-all border border-[#3b404d] hover:border-[#8b5cf6] shadow-md"
                          >
                            {choice === 'rock' ? '🪨 Rock' : choice === 'paper' ? '📄 Paper' : '✂️ Scissors'}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* 4. Reaction Battle */}
                {activeGameRoom.gameType === 'reaction' && (
                  <div className="flex flex-col items-center text-center space-y-4 max-w-md mx-auto">
                    <div>
                      <div className="text-sm font-bold text-white">Reaction Reflex Test! ⚡</div>
                      <div className="text-xs text-[#9ca3af] mt-0.5">Click the button as fast as you can to win!</div>
                    </div>
                    {activeGameRoom.gameState?.clicks?.[currentUser.id] !== undefined ? (
                      <div className="p-6 bg-[#181a1f] rounded-2xl border border-[#262930] w-full space-y-2">
                        <div className="text-xs font-bold text-[#9ca3af] uppercase">YOUR REACTION TIME:</div>
                        <div className="text-2xl font-black text-[#10b981]">
                          {activeGameRoom.gameState.clicks[currentUser.id] >= 99999
                            ? '❌ False Start (Early Click)'
                            : `⚡ ${activeGameRoom.gameState.clicks[currentUser.id]} ms`}
                        </div>
                        <div className="text-xs text-[#9ca3af]">Waiting for opponent to react...</div>
                      </div>
                    ) : (
                      <button
                        onClick={() => sendGameAction('move')}
                        className="w-full h-36 bg-gradient-to-r from-[#10b981] to-[#059669] hover:from-[#059669] hover:to-[#047857] text-white font-black text-xl rounded-2xl shadow-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-1"
                      >
                        <span>CLICK NOW! ⚡</span>
                        <span className="text-xs font-normal opacity-80">Test your millisecond reflex speed</span>
                      </button>
                    )}
                  </div>
                )}

                {/* 5. Number Guessing (1-100) */}
                {activeGameRoom.gameType === 'guess' && (
                  <div className="flex flex-col items-center text-center space-y-4 max-w-md mx-auto">
                    <div>
                      <div className="text-sm font-bold text-white">Secret Number Guessing (1 to 100) 🎯</div>
                      <div className="text-xs text-[#9ca3af] mt-1">
                        Turn: <span className="font-bold text-[#8b5cf6]">@{activeGameRoom.players.find(p => p.userId === activeGameRoom.currentTurn)?.username || '...'}</span>
                      </div>
                    </div>
                    {activeGameRoom.currentTurn === currentUser.id ? (
                      <div className="flex gap-2 w-full">
                        <input
                          type="number"
                          min="1"
                          max="100"
                          value={numberGuessInput}
                          onChange={(e) => setNumberGuessInput(e.target.value)}
                          placeholder="Enter a number (1-100)..."
                          className="flex-1 bg-[#121316] text-white px-3 py-2 text-xs rounded-xl border border-[#262930] focus:outline-none focus:border-[#8b5cf6]"
                        />
                        <button
                          onClick={() => {
                            if (!numberGuessInput.trim()) return;
                            sendGameAction('move', { guess: numberGuessInput.trim() });
                            setNumberGuessInput('');
                          }}
                          className="px-4 py-2 bg-[#8b5cf6] hover:bg-[#7c3aed] text-white text-xs font-bold rounded-xl"
                        >
                          Guess!
                        </button>
                      </div>
                    ) : (
                      <div className="p-3 bg-[#121316] rounded-xl text-xs text-[#9ca3af] w-full">
                        Waiting for opponent to guess...
                      </div>
                    )}
                    {/* Previous Guesses Log */}
                    {activeGameRoom.gameState && activeGameRoom.gameState.guesses && activeGameRoom.gameState.guesses.length > 0 && (
                      <div className="w-full text-left space-y-1.5 pt-2">
                        <div className="text-[11px] font-bold text-[#9ca3af] uppercase tracking-wider">Previous Guesses:</div>
                        <div className="max-h-36 overflow-y-auto space-y-1 bg-[#121316] p-2 rounded-xl border border-[#262930]">
                          {[...activeGameRoom.gameState.guesses].reverse().map((g, idx) => (
                            <div key={idx} className="flex justify-between items-center text-xs px-2 py-1 bg-[#181a1f] rounded-lg">
                              <span className="font-bold text-white">@{g.username}: <span className="text-[#06b6d4]">{g.guess}</span></span>
                              <span className={`font-mono text-[11px] font-bold ${g.hint === 'Correct!' ? 'text-[#10b981]' : g.hint === 'Higher' ? 'text-[#f59e0b]' : 'text-[#ef4444]'}`}>
                                {g.hint === 'Higher' ? '▲ Higher' : g.hint === 'Lower' ? '▼ Lower' : '🎉 Correct!'}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* 6. Multiplayer Trivia */}
                {activeGameRoom.gameType === 'trivia' && activeGameRoom.gameState && (
                  <div className="space-y-4 max-w-lg mx-auto">
                    <div className="flex items-center justify-between text-xs">
                      <span className="font-bold text-[#8b5cf6] uppercase tracking-wider">
                        Question {activeGameRoom.gameState.questionIndex + 1} of {activeGameRoom.gameState.questions.length}
                      </span>
                      <div className="flex gap-2">
                        {activeGameRoom.players.map(p => (
                          <span key={p.userId} className="font-mono text-[11px] px-2 py-0.5 rounded bg-[#262930] text-white">
                            @{p.username}: <span className="text-[#10b981] font-bold">{activeGameRoom.gameState.scores?.[p.userId] || 0} pts</span>
                          </span>
                        ))}
                      </div>
                    </div>

                    <div className="p-4 bg-[#121316] rounded-xl border border-[#262930] text-center font-bold text-white text-sm">
                      {activeGameRoom.gameState.questions[activeGameRoom.gameState.questionIndex]?.q}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {activeGameRoom.gameState.questions[activeGameRoom.gameState.questionIndex]?.options.map((opt, optIdx) => {
                        const hasAnswered = activeGameRoom.gameState.answers?.[currentUser.id] !== undefined;
                        const myPick = activeGameRoom.gameState.answers?.[currentUser.id] === optIdx;
                        return (
                          <button
                            key={optIdx}
                            disabled={hasAnswered}
                            onClick={() => sendGameAction('move', { answerIndex: optIdx })}
                            className={`p-3 rounded-xl text-xs font-bold text-left transition-all border ${
                              myPick
                                ? 'bg-[#8b5cf6] text-white border-[#8b5cf6]'
                                : hasAnswered
                                ? 'bg-[#181a1f] text-[#9ca3af] border-[#262930] opacity-50 cursor-not-allowed'
                                : 'bg-[#262930] hover:bg-[#8b5cf6]/20 text-white border-[#3b404d] hover:border-[#8b5cf6]'
                            }`}
                          >
                            <span className="font-mono mr-2 text-[#9ca3af]">{String.fromCharCode(65 + optIdx)}.</span>
                            <span>{opt}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Game Finished / Winner Screen */}
            {activeGameRoom.status === 'finished' && (
              <div className="p-8 bg-[#181a1f] rounded-2xl border border-[#262930] text-center space-y-3">

    // Bulletproof Error Boundary Component
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('Nexus App ErrorBoundary caught error:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="flex h-screen w-screen items-center justify-center bg-[#0e121a]/95 text-white p-6">
              <div className="max-w-md bg-[#181a1f] p-8 rounded-3xl border border-white/10 text-center space-y-4 shadow-2xl">

                </div>
                <div className="text-lg font-bold text-white">Nexus Lounge Resuming...</div>
                <div className="text-xs text-neutral-400">Click below to restore session and continue gaming:</div>
                <button
                  type="button"
                  onClick={() => { localStorage.clear(); window.location.reload(); }}
                  className="px-5 py-2.5 bg-[#5865f2] hover:bg-[#4752c4] text-white rounded-xl text-xs font-bold transition-all shadow-lg"
                >
                  Start Fresh Session
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>

      </ErrorBoundary>
